[project]
name = "ragamer"
version = "0.1.0"
description = "面向游戏攻略与资料的中文 RAG 助手"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # 语言模型适配器的 HTTP 客户端；自己发 OpenAI 兼容请求，不引 SDK，
    # 以便用 MockTransport 打真实代码路径（含 SSE 解析）而不碰网络
    "httpx>=0.28",
    # 配置装载的唯一入口；用到 dotenv_filtering，故下限取 2.15
    "pydantic-settings>=2.15",
    # 直接读 .env 做「未知键 / 取值被 ${…} 改写」这两项检查，pydantic-settings 不汇报
    "python-dotenv>=1.0",
]

[project.scripts]
ragamer = "ragamer.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragamer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: 需要真实云端与真实模型，默认不跑",
]
addopts = '-m "not integration"'

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["ragamer"]
