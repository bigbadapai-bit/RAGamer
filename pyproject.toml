[project]
name = "ragamer"
version = "0.1.0"
description = "面向游戏攻略与资料的中文 RAG 助手"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # 三个存储客户端。业务层只认 ragamer.stores 里的协议，不直接依赖这三个库
    # 向量库；下限取 3.0 以对齐 Milvus v3 服务端（动态字段那个坑出在 v3.0.0）
    "pymilvus>=3.0",
    "pymongo>=4.9",
    "minio>=7.2",
    # 配置装载的唯一入口；用到 dotenv_filtering，故下限取 2.15
    "pydantic-settings>=2.15",
    # 直接读 .env 做「未知键 / 取值被 ${…} 改写」这两项检查，pydantic-settings 不汇报
    "python-dotenv>=1.0",
    # minio 的传输层就是 urllib3；要自定义 PoolManager 才能设连接超时并关掉重试
    "urllib3>=2.0",
]

[project.scripts]
ragamer = "ragamer.__main__:main"

[project.optional-dependencies]
# 真实向量化模型（BGE-M3 与长上下文 reranker）。它拉进 torch 与 transformers，
# 装一次好几个 G，而核心链路与全部默认测试都用确定性的哈希假件跑——所以放进可选组，
# 只有要跑 `pytest -m integration` 时才 `uv sync --extra models`。
# 适配器里是懒加载：没装这个组也能 import，只在真的要用模型时才报错并说明装法。
models = ["FlagEmbedding>=1.4"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragamer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: 需要真实云端与真实模型，默认不跑",
]
addopts = '-m "not integration"'

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["ragamer"]
