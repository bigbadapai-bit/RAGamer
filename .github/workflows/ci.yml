name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # setup-uv 自 v8 起不再发布浮动大版本标签，只能钉到具体版本
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: 安装依赖
        run: uv sync --locked

      - name: lint
        run: uv run ruff check .

      - name: 格式检查
        run: uv run ruff format --check .

      - name: 测试
        run: uv run pytest
